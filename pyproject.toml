[project]
name = "orlydown"
# Set from the git tag when publishing (see .github/workflows/publish.yml)
version = "0.0.0"
description = "Download O'Reilly books as epub files you can read in any reader"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ashley Connor" },
    { name = "Tobias Bengfort" },
]
requires-python = ">=3.9"
dependencies = []
keywords = ["oreilly", "epub", "ebook", "downloader"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ashleyconnor/orlydown"
Issues = "https://github.com/ashleyconnor/orlydown/issues"

[project.scripts]
orlydown = "oreilly_downloader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["oreilly_downloader.py"]

[tool.hatch.build.targets.sdist]
only-include = ["oreilly_downloader.py", "README.md", "LICENSE"]
